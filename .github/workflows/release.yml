# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          # Generate the token at https://grafana.com/orgs/<your-org>/access-policies and store it
          # as the GRAFANA_ACCESS_POLICY_TOKEN repository secret. Without it the release is
          # unsigned, and an unsigned plugin cannot be published in the Grafana catalog.
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

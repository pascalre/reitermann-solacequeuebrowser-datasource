services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      solace:
        condition: service_healthy

  # Local Solace PubSub+ broker for development.
  #   8080  SEMP / management UI  -> used by Grafana through the data source proxy
  #   8008  Web Messaging (WS)    -> used by the *browser* for the payload browse
  #   9000  REST messaging        -> used by scripts/seed-broker.mjs to spool messages
  #   55555 SMF                   -> plain messaging, handy for other tools
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-queue-browser-broker
    hostname: solace
    shm_size: 1g
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 38048
    ports:
      - '8080:8080'
      - '8008:8008'
      - '9000:9000'
      - '55555:55555'
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      system_scaling_maxconnectioncount: '100'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf -u admin:admin http://localhost:8080/SEMP/v2/monitor/about/api > /dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 45s

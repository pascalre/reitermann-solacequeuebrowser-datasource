services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    # Deliberately service_started, not service_healthy: Grafana does not need a
    # ready broker to load the plugin, and a broker that misbehaves should not
    # block plugin development.
    depends_on:
      solace:
        condition: service_started

  # Local Solace PubSub+ broker for development. Kept close to the reference
  # compose file from SolaceLabs/solace-single-docker-compose, because the broker
  # is picky about its runtime environment.
  #
  #   8008  Web Messaging (WS)     -> what the plugin uses, from the browser
  #   8080  Broker Manager / SEMP  -> for creating queues by hand; also used by npm run seed
  #   9000  REST messaging         -> used by scripts/seed-broker.mjs to spool messages
  #   55554 SMF                    -> macOS blocks 55555 on the host, so it is remapped
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-queue-browser-broker
    shm_size: 1g
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 1048576
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 1
    volumes:
      # The broker keeps its config database here. Without a volume a half-finished
      # first start leaves a broken database in the container layer, and every
      # later start fails while "repairing" it.
      - solace-storage:/var/lib/solace
    ports:
      - '8008:8008'
      - '8080:8080'
      - '9000:9000'
      - '55554:55555'
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      system_scaling_maxconnectioncount: '100'
    healthcheck:
      # No external binary required — some broker images ship without curl.
      test: ['CMD-SHELL', 'timeout 2 bash -c "</dev/tcp/127.0.0.1/8080" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

volumes:
  solace-storage:

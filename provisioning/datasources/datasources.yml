apiVersion: 1

datasources:
  - name: 'Solace Queue Browser'
    uid: 'solace-queue-browser'
    type: 'reitermann-solacequeuebrowser-datasource'
    isDefault: true
    orgId: 1
    version: 1
    editable: true

    jsonData:
      # Web Messaging endpoint, opened by the browser, so this is a host-side URL.
      url: 'ws://localhost:8008'
      msgVpn: 'default'
      userName: 'default'
      password: 'default'
      browseIdleTimeoutMs: 2000
      browseTotalTimeoutMs: 20000
      connectTimeoutMs: 8000
